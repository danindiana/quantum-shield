# SSH Client Configuration - Post-Quantum Security
# Quantum Shield SSH Client Configuration
# Place in ~/.ssh/config or /etc/ssh/ssh_config

# =============================================================================
# GLOBAL POST-QUANTUM DEFAULTS
# =============================================================================

Host *
    # Key Exchange - Post-Quantum Preferred
    KexAlgorithms ml-kem-768,hybrid-x25519-ml-kem-768,curve25519-sha256@libssh.org,curve25519-sha256
    
    # Host Key Algorithms - Post-Quantum Preferred  
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519,rsa-sha2-512
    
    # Public Key Authentication - Post-Quantum Preferred
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519,rsa-sha2-512
    
    # Identity Files - Post-Quantum First
    IdentityFile ~/.ssh/id_ml_dsa_65
    IdentityFile ~/.ssh/id_slh_dsa_128s
    IdentityFile ~/.ssh/id_ed25519
    IdentityFile ~/.ssh/id_rsa
    
    # Symmetric Encryption - Quantum-Resistant
    Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr,aes192-ctr
    
    # Message Authentication - Quantum-Resistant
    MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
    
    # Security Settings
    HashKnownHosts yes
    VerifyHostKeyDNS ask
    StrictHostKeyChecking ask
    CheckHostIP yes
    
    # Known Hosts Configuration
    UserKnownHostsFile ~/.ssh/known_hosts ~/.ssh/known_hosts_pq
    
    # Connection Settings
    ConnectTimeout 30
    ServerAliveInterval 300
    ServerAliveCountMax 2
    
    # Compression
    Compression yes
    CompressionLevel 6
    
    # Agent and Forwarding
    ForwardAgent no
    ForwardX11 no
    ForwardX11Trusted no
    
    # Prevent information leakage
    Protocol 2
    BatchMode no
    PasswordAuthentication no
    PubkeyAuthentication yes

# =============================================================================
# HIGH-SECURITY HOSTS (POST-QUANTUM ONLY)
# =============================================================================

Host secure-* quantum-* prod-* critical-*
    # Post-quantum algorithms only - no classical fallback
    KexAlgorithms ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s
    
    # Only use post-quantum identity files
    IdentitiesOnly yes
    IdentityFile ~/.ssh/id_ml_dsa_65
    IdentityFile ~/.ssh/id_slh_dsa_128s
    
    # Enhanced security settings
    StrictHostKeyChecking yes
    VisualHostKey yes
    
    # Disable all forwarding for maximum security
    ForwardAgent no
    ForwardX11 no
    LocalForward none
    RemoteForward none
    DynamicForward none
    
    # Enhanced monitoring
    LogLevel DEBUG2

# =============================================================================
# PRODUCTION ENVIRONMENTS  
# =============================================================================

Host prod-* production-* live-*
    # Post-quantum preferred with Ed25519 fallback
    KexAlgorithms ml-kem-768,hybrid-x25519-ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519
    
    # Production identity preference
    IdentityFile ~/.ssh/id_ml_dsa_65_prod
    IdentityFile ~/.ssh/id_ml_dsa_65
    IdentityFile ~/.ssh/id_ed25519_prod
    
    # Strict host key checking for production
    StrictHostKeyChecking yes
    
    # Connection pooling for performance
    ControlMaster auto
    ControlPath ~/.ssh/connections/%r@%h:%p
    ControlPersist 10m

# =============================================================================
# DEVELOPMENT AND TESTING ENVIRONMENTS
# =============================================================================

Host dev-* test-* staging-* sandbox-*
    # Hybrid mode for compatibility during development
    KexAlgorithms hybrid-x25519-ml-kem-768,ml-kem-768,curve25519-sha256
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-ed25519,rsa-sha2-512
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-ed25519,rsa-sha2-512
    
    # Development identity files
    IdentityFile ~/.ssh/id_ml_dsa_65_dev
    IdentityFile ~/.ssh/id_ml_dsa_65
    IdentityFile ~/.ssh/id_ed25519
    
    # Relaxed host key checking for development
    StrictHostKeyChecking no
    UserKnownHostsFile ~/.ssh/known_hosts_dev
    
    # Allow forwarding for development convenience
    ForwardAgent yes
    ForwardX11 yes
    
    # Connection multiplexing for frequent connections
    ControlMaster auto
    ControlPath ~/.ssh/connections/dev_%r@%h:%p
    ControlPersist 30m

# =============================================================================
# LEGACY SYSTEMS (DURING MIGRATION)
# =============================================================================

Host legacy-* old-* migration-*
    # Classical algorithms only (temporary during migration)
    KexAlgorithms curve25519-sha256,diffie-hellman-group16-sha512
    HostKeyAlgorithms ssh-ed25519,rsa-sha2-512
    PubkeyAcceptedKeyTypes ssh-ed25519,rsa-sha2-512
    
    # Classical identity files only
    IdentityFile ~/.ssh/id_ed25519_legacy
    IdentityFile ~/.ssh/id_ed25519
    IdentityFile ~/.ssh/id_rsa
    
    # Special known hosts file for legacy systems
    UserKnownHostsFile ~/.ssh/known_hosts_legacy
    
    # Log these connections for migration tracking
    LogLevel VERBOSE

# =============================================================================
# CLOUD PROVIDERS AND SERVICES
# =============================================================================

# AWS Instances
Host *.amazonaws.com *.compute-1.amazonaws.com
    # Hybrid mode for cloud compatibility
    KexAlgorithms hybrid-x25519-ml-kem-768,curve25519-sha256
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-ed25519,rsa-sha2-512
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-ed25519,rsa-sha2-512
    
    # AWS-specific identity files
    IdentityFile ~/.ssh/aws_ml_dsa_65
    IdentityFile ~/.ssh/aws_ed25519
    
    # AWS connection optimization
    ServerAliveInterval 60
    TCPKeepAlive yes

# Google Cloud
Host *.googleusercontent.com
    KexAlgorithms hybrid-x25519-ml-kem-768,curve25519-sha256
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-ed25519
    IdentityFile ~/.ssh/gcp_ml_dsa_65
    IdentityFile ~/.ssh/gcp_ed25519

# Azure
Host *.cloudapp.azure.com
    KexAlgorithms hybrid-x25519-ml-kem-768,curve25519-sha256  
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-ed25519
    IdentityFile ~/.ssh/azure_ml_dsa_65
    IdentityFile ~/.ssh/azure_ed25519

# =============================================================================
# INTERNAL NETWORKS
# =============================================================================

Host 10.* 192.168.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.*
    # Enhanced post-quantum for internal networks
    KexAlgorithms ml-kem-768,hybrid-x25519-ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519
    
    # Internal identity files
    IdentityFile ~/.ssh/id_ml_dsa_65_internal
    IdentityFile ~/.ssh/id_ml_dsa_65
    
    # Relaxed settings for internal networks
    StrictHostKeyChecking no
    UserKnownHostsFile ~/.ssh/known_hosts_internal
    
    # Optimize for internal network performance
    Compression no
    ServerAliveInterval 120

# =============================================================================
# BASTION/JUMP HOSTS
# =============================================================================

Host bastion-* jump-* gateway-*
    # Strong post-quantum for bastion hosts
    KexAlgorithms ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s
    
    # Bastion-specific keys
    IdentityFile ~/.ssh/id_ml_dsa_65_bastion
    IdentityFile ~/.ssh/id_slh_dsa_128s_bastion
    
    # Enhanced security for bastion hosts
    StrictHostKeyChecking yes
    ForwardAgent no
    
    # Connection multiplexing for jump host efficiency
    ControlMaster auto
    ControlPath ~/.ssh/connections/bastion_%r@%h:%p
    ControlPersist 30m
    
    # Enable agent forwarding only when needed
    # ForwardAgent yes  # Uncomment only if required

# =============================================================================
# SPECIFIC HOST EXAMPLES
# =============================================================================

# High-security database server
Host db-prod.company.com
    Hostname db-prod.company.com
    User dbadmin
    Port 2222
    KexAlgorithms ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65
    IdentityFile ~/.ssh/db_ml_dsa_65
    StrictHostKeyChecking yes
    LogLevel DEBUG

# Development server with port forwarding
Host dev.company.com
    Hostname dev.company.com  
    User developer
    Port 22
    KexAlgorithms hybrid-x25519-ml-kem-768,ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-ed25519
    IdentityFile ~/.ssh/dev_ml_dsa_65
    LocalForward 8080 localhost:80
    LocalForward 3306 db-dev:3306
    ForwardAgent yes

# Backup server
Host backup.company.com
    Hostname backup.company.com
    User backup
    KexAlgorithms ml-kem-768
    HostKeyAlgorithms ssh-slh-dsa-128s,ssh-ml-dsa-65
    IdentityFile ~/.ssh/backup_slh_dsa_128s
    Compression yes
    CompressionLevel 9
    ServerAliveInterval 60

# =============================================================================
# QUANTUM SHIELD SPECIFIC SETTINGS
# =============================================================================

# Quantum Shield management hosts
Host quantum-shield-* qs-*
    # Latest post-quantum algorithms
    KexAlgorithms ml-kem-768
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s
    
    # Quantum Shield specific keys
    IdentityFile ~/.ssh/quantum_shield_ml_dsa_65
    IdentityFile ~/.ssh/quantum_shield_slh_dsa_128s
    
    # Maximum security settings
    StrictHostKeyChecking yes
    VisualHostKey yes
    HashKnownHosts yes
    
    # Detailed logging for security analysis
    LogLevel DEBUG3

