# =============================================================================
# SECURITY NOTES AND BEST PRACTICES
# =============================================================================

# IMPORTANT SECURITY REMINDERS:
# 
# 1. Key Management:
#    - Generate separate keys for different environments
#    - Use strong passphrases for private keys in high-security environments
#    - Regularly rotate post-quantum keys
#    - Store backup keys securely
#
# 2. Host Key Verification:
#    - Always verify host keys on first connection
#    - Use StrictHostKeyChecking=yes for production systems
#    - Maintain separate known_hosts files for different environments
#
# 3. Algorithm Selection:
#    - Prefer ML-DSA-65 and ML-KEM-768 for best security/performance balance
#    - Use SLH-DSA-128s for long-term security requirements
#    - Gradually phase out classical algorithms
#
# 4. Monitoring and Logging:
#    - Enable verbose logging for post-quantum connections
#    - Monitor algorithm usage and compatibility issues
#    - Set up alerts for classical algorithm usage
#
# 5. Network Security:
#    - Use different configurations for internal vs external networks
#    - Implement proper firewall rules
#    - Consider VPN for additional protection
#
# 6. Migration Strategy:
#    - Test post-quantum configurations in non-production first
#    - Maintain classical key fallbacks during migration
#    - Update configurations gradually across environments
#
# TROUBLESHOOTING:
#
# Test connection with verbose output:
# ssh -v -F ~/.ssh/config hostname
#
# Check supported algorithms:
# ssh -Q cipher
# ssh -Q kex
# ssh -Q key
#
# Validate configuration:
# ssh -F ~/.ssh/config -T git@github.com