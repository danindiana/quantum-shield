# SSH Daemon Configuration - Post-Quantum Security
# Quantum Shield SSH Configuration Template
# Generated for production use with NIST-compliant post-quantum cryptography

# =============================================================================
# PROTOCOL AND BASIC SETTINGS
# =============================================================================

# SSH Protocol version (only version 2 is secure)
Protocol 2

# Port configuration
Port 22
#Port 2222  # Uncomment for non-standard port

# Network binding
#ListenAddress 0.0.0.0
#ListenAddress ::
AddressFamily any

# =============================================================================
# HOST KEY CONFIGURATION (POST-QUANTUM)
# =============================================================================

# Post-Quantum Host Keys (NIST Standards)
HostKey /etc/ssh/ssh_host_ml_dsa_65_key      # ML-DSA-65 (Primary PQ)
HostKey /etc/ssh/ssh_host_slh_dsa_128s_key   # SLH-DSA-128s (Backup PQ)

# Classical Host Keys (Keep during migration period)
HostKey /etc/ssh/ssh_host_ed25519_key        # Ed25519 (Transition)
HostKey /etc/ssh/ssh_host_rsa_key            # RSA (Legacy support)

# =============================================================================
# CRYPTOGRAPHIC ALGORITHM CONFIGURATION
# =============================================================================

# Host Key Algorithms (Post-Quantum Preferred)
HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Public Key Authentication Algorithms (Post-Quantum Preferred)
PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Key Exchange Algorithms (Post-Quantum First)
KexAlgorithms ml-kem-768,hybrid-x25519-ml-kem-768,curve25519-sha256@libssh.org,curve25519-sha256,diffie-hellman-group16-sha512

# Symmetric Ciphers (Quantum-Resistant)
Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr,aes192-ctr,aes128-gcm@openssh.com,aes128-ctr

# Message Authentication Codes (Quantum-Resistant)
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512

# =============================================================================
# AUTHENTICATION CONFIGURATION
# =============================================================================

# Authentication methods
AuthenticationMethods publickey
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2

# Disable weaker authentication methods
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KerberosAuthentication no
GSSAPIAuthentication no
HostbasedAuthentication no

# Root login restrictions
PermitRootLogin no

# =============================================================================
# SECURITY HARDENING
# =============================================================================

# Login restrictions
MaxAuthTries 3
MaxSessions 10
MaxStartups 10:30:100
LoginGraceTime 30

# Connection timeouts
ClientAliveInterval 300
ClientAliveCountMax 2

# User and group restrictions
AllowUsers quantum-admin ssh-users
DenyUsers root daemon bin
DenyGroups root daemon

# Environment restrictions
PermitUserEnvironment no
AcceptEnv LANG LC_*
PermitTunnel no
AllowAgentForwarding yes
AllowTcpForwarding local
GatewayPorts no

# X11 and forwarding
X11Forwarding no
X11DisplayOffset 10
X11UseLocalhost yes

# =============================================================================
# LOGGING AND MONITORING
# =============================================================================

# Logging configuration
LogLevel VERBOSE
SyslogFacility AUTH

# Additional security logging
# Log all authentication attempts for post-quantum algorithm tracking
UsePAM no

# =============================================================================
# NETWORK CONFIGURATION  
# =============================================================================

# Network settings
TCPKeepAlive yes
UseDNS no
Compression delayed
PermitUserRC no

# Banner (optional)
#Banner /etc/ssh/banner

# =============================================================================
# QUANTUM SHIELD SPECIFIC CONFIGURATIONS
# =============================================================================

# Match blocks for different security levels

# High-Security Users (Post-Quantum Only)
Match User quantum-admin,security-*
    # Force post-quantum algorithms only
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s  
    KexAlgorithms ml-kem-768
    # Enhanced security settings
    MaxAuthTries 2
    ClientAliveInterval 180
    AllowTcpForwarding no
    AllowAgentForwarding no
    # Force specific source IPs if needed
    #AllowUsers quantum-admin@10.0.1.0/24

# Development Users (Hybrid Mode)
Match User dev-*,test-*
    # Allow hybrid algorithms for compatibility
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-ed25519
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-ed25519
    KexAlgorithms hybrid-x25519-ml-kem-768,ml-kem-768,curve25519-sha256
    # Relaxed settings for development
    MaxAuthTries 5
    AllowTcpForwarding yes

# Legacy Systems Support (During Migration)
Match User legacy-*,migration-*
    # Support classical algorithms during transition
    HostKeyAlgorithms ssh-ed25519,rsa-sha2-512
    PubkeyAcceptedKeyTypes ssh-ed25519,rsa-sha2-512
    KexAlgorithms curve25519-sha256,diffie-hellman-group16-sha512
    # Log these connections for migration tracking
    LogLevel DEBUG2

# Time-based restrictions (optional)
#Match User *
#    # Only allow connections during business hours
#    AllowUsers *@*:09:00-17:00

# IP-based restrictions for high-security
Match Address 10.0.0.0/8,192.168.0.0/16,172.16.0.0/12
    # Internal networks get enhanced PQ settings
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s,ssh-ed25519
    KexAlgorithms ml-kem-768,hybrid-x25519-ml-kem-768

# External connections (more restrictive)
Match Address !10.0.0.0/8,!192.168.0.0/16,!172.16.0.0/12
    # External connections require strongest PQ algorithms
    HostKeyAlgorithms ssh-ml-dsa-65,ssh-slh-dsa-128s
    PubkeyAcceptedKeyTypes ssh-ml-dsa-65,ssh-slh-dsa-128s
    KexAlgorithms ml-kem-768
    MaxAuthTries 2
    ClientAliveInterval 120

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Subsystems
Subsystem sftp /usr/lib/openssh/sftp-server

# Key regeneration (for host keys)
#RekeyLimit 1G 1h  # Uncomment for frequent rekeying

# =============================================================================
# QUANTUM SHIELD MONITORING HOOKS
# =============================================================================

# Custom authentication logging (if supported)
#AuthorizedKeysCommand /usr/local/bin/quantum-shield-auth-logger
#AuthorizedKeysCommandUser quantum-logger

# =============================================================================
# NOTES AND WARNINGS
# =============================================================================

# IMPORTANT SECURITY NOTES:
# 1. Test this configuration in a non-production environment first
# 2. Ensure you have console access before applying changes
# 3. Gradually migrate from classical to post-quantum algorithms
# 4. Monitor logs for algorithm usage and compatibility issues
# 5. Keep classical keys as backup during migration period
#
# QUANTUM SHIELD COMPLIANCE:
# - ML-DSA-65: NIST FIPS 204 compliant
# - SLH-DSA-128s: NIST FIPS 205 compliant  
# - ML-KEM-768: NIST FIPS 203 compliant
# - AES-256: Quantum-resistant symmetric encryption
# - SHA-2: Quantum-resistant hashing
#
# MIGRATION PHASES:
# Phase 1: Hybrid (classical + PQ) - Current configuration
# Phase 2: PQ-preferred (PQ first, classical fallback)
# Phase 3: PQ-only (disable all classical algorithms)
#
# To validate this configuration:
# sudo sshd -t -f /etc/ssh/sshd_config
#
# To apply changes:
# sudo systemctl restart ssh
# OR
# sudo service ssh restart