<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#39ffe0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#39ffe0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39ffe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2ec4"/>
      <stop offset="100%" stop-color="#8f5cff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="160" fill="url(#bg)"/>

  <!-- shield glyph -->
  <g transform="translate(80,80)">
    <path d="M 0 -40 L 32 -26 L 32 6 C 32 30 16 42 0 48 C -16 42 -32 30 -32 6 L -32 -26 Z"
          fill="#161b22" stroke="#39ffe0" stroke-width="3"/>
    <circle r="14" fill="url(#glow)" stroke="#8f5cff" stroke-width="2"/>
    <path d="M -6 0 L -2 6 L 8 -8" stroke="#ffcb47" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="180" y="78" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">quantum-shield</text>
  <text x="180" y="104" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a99a8">post-quantum crypto via liboqs — experimental, not audited</text>

  <rect x="180" y="116" width="360" height="3" rx="1.5" fill="url(#sweep)"/>
</svg>
